<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Management</title>
            <!-- Bootstrap 4 CDN -->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
            <!-- Chart.js CDN -->
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Dark Mode CSS Adjustments */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        .dark-mode .card {
            background-color: #1e1e1e;
            border-color: #333;
            color: #fff;
        }
        .dark-mode .table {
            color: #fff;
            background-color: #1e1e1e;
        }
        .dark-mode .table th, .dark-mode .table td {
            border-color: #333;
        }
        .dark-mode .list-group-item {
            background-color: #1e1e1e;
            color: #fff;
            border-color: #333;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">SecureBank</a>
            <div class="ml-auto d-flex align-items-center">
                <button id="themeToggle" class="btn btn-sm btn-outline-light mr-3">Toggle Dark Mode 🌓</button>
                {% if user.is_authenticated %}
                    <span class="navbar-text mr-3 text-white">Welcome, {{ user.username }}</span>
                    <a href="{% url 'history' %}" class="btn btn-outline-light btn-sm mr-2">History</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm mr-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-light btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>

    <!-- Dark Mode Memory Script -->
    <script>
        const toggleBtn = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
