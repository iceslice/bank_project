{% extends 'base.html' %}
{% load bootstrap4 %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3 text-center">Account Security Gateway</h3>
            <form method="POST">
                {% csrf_token %}
                {% bootstrap_form form %}
                <button type="submit" class="btn btn-primary btn-block">Authorize & Login</button>
            </form>
            <p class="mt-3 text-center">New user? <a href="{% url 'register' %}">Create account profile here</a></p>
        </div>
    </div>
</div>
{% endblock %}
