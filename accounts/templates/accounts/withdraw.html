{% extends 'base.html' %}
{% load bootstrap4 %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3 text-center text-warning">Secure Funds Withdrawal</h3>
            <div class="alert alert-warning py-2 small text-center">
                Overdraft protection active. Transactions exceeding your current balance will be declined.
            </div>
            <form method="POST">
                {% csrf_token %}
                {% bootstrap_form form %}
                <button type="submit" class="btn btn-warning btn-block">Execute Withdrawal Transaction</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'dashboard' %}" class="btn btn-sm btn-link text-secondary">Cancel and Return to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
